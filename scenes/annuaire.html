<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Annuaire</title>
  <style>
    body { margin: 0; padding: 18px 24px; color: #23302e; background: #f2f5fa; font-family: "Segoe UI", sans-serif; }
    h1 { margin: 0 0 10px; font-size: 21px; }
    input { padding: 7px 10px; font: inherit; font-size: 13px; border: 1px solid #b9c4d4; border-radius: 6px; }
    #chargement { color: #6b4fa0; font-style: italic; }
    #erreur { color: #c0392b; }
    #annuaire { padding-left: 20px; line-height: 1.8; }
    #total { color: #6e7e79; font-size: 13px; }
    .formateur { font-weight: 700; color: #6b4fa0; }
  </style>
</head>
<body>
  <h1>Annuaire de la promo</h1>
  <input id="filtre" type="text" placeholder="Filtrer par ville">
  <p id="chargement" hidden>Chargement…</p>
  <p id="erreur"></p>
  <ul id="annuaire"></ul>
  <p id="total"></p>
</body>
</html>
